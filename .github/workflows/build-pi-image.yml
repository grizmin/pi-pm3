name: Build Raspberry Pi Image

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: fix apt keys
        run: |
          for key in 6ED0E7B82643E131 78DBA3BC47EF2265 F8D2585B8783D481 54404762BBB6E853 BDE6D2B9216EC7A8; do
            gpg --keyserver keyserver.ubuntu.com --recv-keys $key
            gpg --export --armor $key > /tmp/$key.asc
            sudo install -m 644 /tmp/$key.asc /etc/apt/trusted.gpg.d/
          done

      - name: Build Raspberry Pi Image with pi-gen
        uses: usimd/pi-gen-action@v1
        id: build_pi_pm3
        with:
          image-name: pi-pm3-${{ github.event.inputs.tag || github.ref_name }}
          pi-gen-dir: ${{ github.workspace }}/pi-gen-origin
          stage-list: "stage0 stage1 stage2 ./pi-gen/stageDTPM3"
          verbose-output: true